[pytest]
testpaths = tests
asyncio_mode = auto

# GPU tests are deselected by default. The whole point of the process-isolation
# invariant is that the API, the domain layer, and even the scheduler are
# testable with no CUDA — so the default loop is CPU-only and finishes in ~30s.
# Opt in explicitly on the pod: pytest -m gpu
addopts = -m "not gpu" --strict-markers -q

markers =
    gpu: requires a real GPU, real weights, and a real worker subprocess. Pod only.
    slow: takes more than a second.
    contract: asserts a Wave 0 contract still holds. Never delete one of these
        to make a change land — amend the contract instead.

filterwarnings =
    error::DeprecationWarning
