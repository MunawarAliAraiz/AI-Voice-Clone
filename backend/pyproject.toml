[project]
name = "voice-clone-studio-backend"
version = "0.1.0"
description = "AI Voice Clone Studio — FastAPI backend for personal voice cloning and multilingual TTS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydub>=0.25.0",
    "soundfile>=0.12.0",
    "f5-tts>=1.1.22",
    "pyarrow<20",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.36.2",
    "transformers>=4.57.6",
    "accelerate>=1.14.0",
    "datasets>=2.14.4",
    "librosa>=0.11.0",
    "scipy>=1.18.0",
    "hydra-core>=1.3.4",
    "omegaconf>=2.3.1",
    "vocos>=0.1.0",
    "einops>=0.8.2",
    "ema-pytorch>=0.8.3",
    "safetensors>=0.8.0",
    "coqui-tts>=0.25.0",
    "fish-speech @ git+https://github.com/fishaudio/fish-speech.git",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]
# These TTS engine packages require special installation:
#   pip install f5-tts       (F5-TTS engine)
#   pip install coqui-tts    (XTTS v2 engine via Coqui)
#   pip install fish-speech  (Fish Speech S2 engine — install from GitHub)

[tool.uv]
# PyTorch CUDA 12.x index for GPU builds
extra-index-url = ["https://download.pytorch.org/whl/cu124"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
