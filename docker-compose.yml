# ---------------------------------------------------------------
# AI Voice Clone Studio — Docker Compose
# ---------------------------------------------------------------
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f backend
# ---------------------------------------------------------------

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: voice-clone-backend:latest
    container_name: voice-clone-backend
    restart: unless-stopped
    ports:
      - "${VCS_PORT:-8000}:8000"
    environment:
      - VCS_HOST=0.0.0.0
      - VCS_PORT=8000
      - VCS_DEBUG=false
      - VCS_DEFAULT_ENGINE=${VCS_DEFAULT_ENGINE:-f5_tts}
      - VCS_API_KEY=${VCS_API_KEY:-}
      - VCS_CORS_ORIGINS=${VCS_CORS_ORIGINS:-}
      - VCS_USE_GPU=true
    volumes:
      # Persist all data (voice recordings, generated audio, models, DB)
      # across container restarts and image rebuilds
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional: Nginx reverse proxy for HTTPS and domain routing
  # Uncomment to enable. Replace YOUR_DOMAIN with your actual domain.
