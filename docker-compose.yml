services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: voice-clone-backend:latest
    container_name: voice-clone-backend
    restart: unless-stopped
    ports:
      - "${VCS_PORT:-8000}:8000"
    environment:
      - VCS_HOST=0.0.0.0
      - VCS_PORT=8000
      - VCS_DEBUG=false
      - VCS_DEFAULT_ENGINE=${VCS_DEFAULT_ENGINE:-f5_tts}
      - VCS_API_KEY=${VCS_API_KEY:-}
      - VCS_CORS_ORIGINS=${VCS_CORS_ORIGINS:-}
      - VCS_USE_GPU=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: voice-clone-frontend:latest
    container_name: voice-clone-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-1420}:1420"
    depends_on:
      - backend
